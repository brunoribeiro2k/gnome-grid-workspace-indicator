name: Release

# When a version bump lands on main, tag it and draft a GitHub release. Detection is
# driven by metadata.json: if its integer `version` has no `v<N>` release yet, this
# builds the bundle, pushes the `v<N>` tag and drafts a release with the zip attached.
# Idempotent: pushes that don't change the version (and re-runs) are a no-op, and
# version 0 means "never released". The shell-version tests already ran on the release
# PR (shell-tests.yml). Uploading the zip to extensions.gnome.org stays manual.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Only main is released, even when dispatched by hand from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version metadata.json)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0 ]; then
            echo "Version 0 is never released — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y glib2.0-bin gnome-shell

      - name: Build bundle
        if: steps.check.outputs.release == 'true'
        run: make bundle

      - name: Attest build provenance
        if: steps.check.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.shell-extension.zip

      - name: Push tag
        if: steps.check.outputs.release == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — reusing it."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create draft release
        id: release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          url="$(gh release create "$TAG" \
            --title="$TAG" \
            --draft \
            --generate-notes \
            dist/*.shell-extension.zip)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          {
            echo "### 📦 Drafted release \`$TAG\`"
            echo ""
            echo "- Tag \`$TAG\` pushed"
            echo "- Draft release with the \`.shell-extension.zip\` (provenance attested)"
            echo "- Review the notes and publish: $URL"
            echo "- Then upload the zip at https://extensions.gnome.org/upload/"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="📦 Drafted release [\`$TAG\`]($URL) from this commit. Review the notes, publish, then upload the zip to extensions.gnome.org."
